# Route by PROMPT PREFIX, not by connection count.
#
# SGLang caches KV by prefix, and that cache is per replica. Calls carrying the
# same campaign prompt only share the work if the same replica serves them, so a
# connection-counting balancer splits related work and each replica pays the
# prefill again. It also moves a single call between replicas turn to turn, so
# the history it just built may not be resident where its next turn lands.
#
# The agent tags every request with a hash of its system prompt's leading bytes
# (X-Prefix-Key, see pkg/rexa/route.go) and this hashes on that tag: identical
# prefixes pin to one replica and stay warm.
#
# THE TRADE: cache locality against load balance. `least_conn` spreads evenly
# and wastes cache; hashing keeps cache and can pile one large campaign onto one
# replica. Right while campaigns comfortably outnumber replicas. If you ever run
# a single campaign across many replicas, `least_conn` is the better choice --
# switch it back and take the prefill hit.

# A request with no tag must not all land on one replica, which is what hashing
# an empty string would do. $request_id is unique per request, so untagged
# traffic spreads the way it used to.
map $http_x_prefix_key $llm_route {
  ""      $request_id;
  default $http_x_prefix_key;
}

upstream llm {
  # `consistent` is ketama hashing: adding or removing a replica remaps roughly
  # 1/N of keys instead of reshuffling everything and cold-starting the fleet.
  hash $llm_route consistent;
  server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
  server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;
  keepalive 128;
}
server {
  listen 127.0.0.1:8011;
  access_log off;
  proxy_read_timeout 300s;
  proxy_buffering off;                # streamed SSE tokens must not be buffered
  location / {
    proxy_pass http://llm;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
