upstream llm {
  least_conn;                         # send each turn to the least busy replica
  server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
  server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;
  keepalive 128;
}
server {
  listen 127.0.0.1:8011;
  access_log off;
  proxy_read_timeout 300s;
  proxy_buffering off;                # streamed SSE tokens must not be buffered
  location / {
    proxy_pass http://llm;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
